<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проверка протокола</title>
<style>
:root{--bg:#f2f3fa;--card:#fff;--ink:#15154f;--text:#23234a;--muted:#5d6088;--line:#dfe1f0;--accent:#0042fe;--accent-text:#fff;--ok:#1a7f4b;--warn:#c2410c;--soft:#f5f6fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d36;--card:#16165a;--ink:#ffffff;--text:#dcdcf5;--muted:#9d9fd6;--line:#29297a;--accent:#e1ff00;--accent-text:#15154f;--ok:#7be0a8;--warn:#ff9a74;--soft:#1c1c66}}
:root[data-theme="dark"]{--bg:#0d0d36;--card:#16165a;--ink:#ffffff;--text:#dcdcf5;--muted:#9d9fd6;--line:#29297a;--accent:#e1ff00;--accent-text:#15154f;--ok:#7be0a8;--warn:#ff9a74;--soft:#1c1c66}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;color:var(--ink)}
h2{font-size:18px;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--muted);font-size:14px;margin:6px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);flex:1;min-width:220px}
select{width:100%;font:inherit;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.55;cursor:default}
.status{color:var(--muted);font-size:14px;margin-top:10px;min-height:1.5em}
ul.checks{list-style:none;margin:0;padding:0}
ul.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ul.checks li:first-child{border-top:0}
.i-ok{color:var(--ok);font-weight:800}.i-warn{color:var(--warn);font-weight:800}.i-info{color:var(--muted);font-weight:800}
ul.checks b{color:var(--ink)}
ul.checks small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.verdict{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 8px}
.verdict.bad{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:8px}
.impact{background:var(--soft);border-radius:12px;padding:12px 14px;margin:4px 0 6px}
.imp-t{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.imp-h{margin:8px 0 2px;font-weight:700}
.imp ul{margin:0;padding-left:20px;font-size:14px}
.i-no{color:var(--muted);font-weight:800}
</style>
</head>

  <section class="card">
    <div class="form"><label>Этап<select id="ev"><option>Загружаю этапы…</option></select></label><button id="go" type="button" disabled>Проверить</button><button id="copy" type="button" class="secondary" hidden>Скопировать отчёт</button></div>

  </section>
  <div id="out"></div>
</main>
